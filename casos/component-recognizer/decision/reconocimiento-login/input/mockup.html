<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mockup — login de webapp DESY</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; color: #111; }
    .banda { background: #f4f4f4; border-bottom: 1px solid #d6d6d6; padding: 8px 24px; }
    .banda .logo { display: inline-block; width: 28px; height: 28px; background: #00607a; }
    main { max-width: 420px; margin: 64px auto; }
    h1 { font-size: 28px; margin: 0 0 24px; }
    .campo { margin-bottom: 20px; }
    label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
    input { width: 100%; height: 42px; border: 1px solid #8aa0a8; border-radius: 4px; padding: 0 10px; font-size: 15px; }
    .boton { display: block; width: 100%; height: 42px; background: #00607a; color: #fff; border: 0; border-radius: 4px; font-size: 16px; font-weight: 600; }
    footer { margin-top: 96px; border-top: 1px solid #d6d6d6; padding: 20px 24px; display: flex; gap: 16px; }
    footer .sello { width: 40px; height: 24px; background: #d6d6d6; }
  </style>
</head>
<body>
  <header class="banda"><span class="logo" role="img" aria-label="Escudo de Aragón"></span></header>
  <main>
    <h1>Acceso</h1>
    <div class="campo">
      <label for="usuario">Usuario</label>
      <input id="usuario" type="text" />
    </div>
    <div class="campo">
      <label for="contrasena">Contraseña</label>
      <input id="contrasena" type="password" />
    </div>
    <button class="boton" type="submit">Acceder</button>
  </main>
  <footer>
    <span class="sello"></span><span class="sello"></span><span class="sello"></span>
  </footer>
</body>
</html>
